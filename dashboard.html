<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="E-Summit 2026 Dashboard — Team Portal & Admin Panel.">
  <meta name="theme-color" content="#e9e1d2">
  <title>Dashboard — E-Summit 2026</title>
  <script>
    (() => {
      // Seamlessly strip '.html' from URL bar immediately
      if (window.location.pathname.endsWith(".html")) {
        let cleanPath = window.location.pathname.replace(/\.html$/, "");
        if (cleanPath.endsWith("/index")) cleanPath = cleanPath.slice(0, -5) || "/";
        window.history.replaceState(null, "", cleanPath + window.location.search + window.location.hash);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260907-5">
  <script src="viewport.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="analytics.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="dash-body">
  <a class="skip-link" href="#dashMain">Skip to dashboard content</a>
  <div class="site-grain" aria-hidden="true"></div>

  
  <!-- Welcome Splash -->
  <div class="dashboard-opening" id="dashboardOpening" aria-hidden="true">
    <div class="dashboard-opening-rule"></div>
    <div class="dashboard-opening-top"><p class="mono-label">DIT UNIVERSITY / CIIES</p><span class="dashboard-opening-index">SYS / 01</span></div>
    <h1>DIT E—SUMMIT<br><span>DASHBOARD</span></h1>
    <p class="dashboard-opening-note" id="dashboardOpeningNote">Welcome back. Your dashboard is ready.</p>
    <div class="dashboard-opening-progress"><span></span></div>
    <div class="dashboard-opening-mark"><span></span><span></span><span></span></div>
  </div>

  <!-- ═══ Dashboard Header ═══ -->
  <header class="dash-header">
    <div class="dash-header-inner">
      <a class="wordmark dash-wordmark" href="./" aria-label="E-Summit 2026 home">
        <span aria-hidden="true">E—</span><span>SUMMIT</span><sup>26</sup>
      </a>
      <div class="dash-header-meta">
        <span class="dash-live-status" id="dashLiveStatus" aria-live="polite"><i aria-hidden="true"></i><span>Checking server</span></span>
        <span class="dash-role-badge" id="dashRoleBadge">LOADING</span>
        <button class="dash-logout-btn" id="logoutBtn" type="button" aria-label="Log out of dashboard">
          <span>Log out</span>
          <svg class="dash-icon dash-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══ Dashboard Content ═══ -->
  <main class="dash-main" id="dashMain" aria-live="polite" aria-busy="true">
    <div class="dash-loading" id="dashLoading">
      <div class="dash-loading-spinner"></div>
      <p class="mono-label">LOADING PORTAL</p>
    </div>
  </main>

  <!-- Dynamic Live Toast Notification Container -->
  <div id="dashToast" class="dash-toast" role="status" aria-live="polite" aria-atomic="true" style="display: none;" hidden></div>

  <script src="dashboard.js?v=20260907-5"></script>
</body>
</html>
